<script>
{
/* ================= temel ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K1='pf.v1',K2='pf.v2e',KM='pf.meta',DAY=864e5;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const st=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true}catch(e){return false}};
const DEF=()=>({pos:[],tx:[],prices:{},hist:{},realized:0,netIn:null,lastBk:0,txSinceBk:0,rules:null,peaks:{},lastRebal:0,set:{key:'',refresh:60,targets:{},colors:{},hide:false,tab:'ozet',band:5,pref:{}}});
const merge=o=>{const d=DEF();o=o||{};return {...d,...o,set:{...d.set,...(o.set||{})}}};
let M={theme:'auto',pinLen:4,bio:false,fails:0,until:0,...(ld(KM)||{})};
const saveM=()=>st(KM,M);
let S=DEF(),E=ld(K2),DK=null,RAW=null,locked=false,legacyPin=null,started=false;

const nf=(a,b)=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:a,maximumFractionDigits:b});
const N2=nf(2,2),N1=nf(1,1),N0=nf(0,0),NQ=nf(0,4);
const MI='−';
const usd=v=>v==null||!isFinite(v)?'—':(v<0?MI:'')+'$'+N2.format(Math.abs(v));
const usdK=v=>!isFinite(v)?'—':Math.abs(v)>=1e5?(v<0?MI:'')+'$'+N0.format(Math.abs(v)):usd(v);
const sUsd=v=>!isFinite(v)?'—':(v>=0?'+':MI)+'$'+N2.format(Math.abs(v));
const pct=v=>!isFinite(v)?'—':'%'+N1.format(v*100);
const arw=v=>!isFinite(v)?'—':(v>0.00005?'▲ ':v<-0.00005?'▼ ':'')+'%'+N2.format(Math.abs(v*100));
const pp=v=>(v>=0?'+':MI)+N1.format(Math.abs(v*100))+' puan';
const cls=v=>v>0.00005?'up':v<-0.00005?'dn':'';
const parseNum=s=>{s=String(s??'').trim().replace(/[\s$]/g,'');if(!s)return NaN;
 if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(s.includes(','))s=s.replace(',','.');
 s=s.replace(/^\+/,'');return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN};
const isoD=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);const today=()=>isoD(new Date());const daysAgo=n=>isoD(new Date(Date.now()-n*864e5));
const fmtD=d=>{const [y,m,dd]=d.split('-');return dd+'.'+m+'.'+y};
const ago=t=>{const s=(Date.now()-t)/1000;return s<90?'az önce':s<3600?Math.round(s/60)+' dk önce':s<86400?Math.round(s/3600)+' sa önce':Math.round(s/86400)+' gün önce'};
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>';

/* ================= tema ================= */
function applyTheme(){const r=document.documentElement;if(M.theme==='auto')r.removeAttribute('data-theme');else r.dataset.theme=M.theme;
 const dark=M.theme==='dark'||(M.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#07090d':'#0e1522'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();if(started)render()})}catch(e){}

/* ================= şifreleme ================= */
const te=new TextEncoder(),td=new TextDecoder();
function b64(u){u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pinKey(pin,salt,iter){const k=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const aesKey=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function aesEnc(key,bytes){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:b64(iv),ct:b64(ct)}}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct)))}
async function legacyHash(p){const d=te.encode('pf-salt:'+p);try{const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;for(const b of d){h^=b;h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}}
const ITER=310000;
async function setupEnc(pin,len){RAW=rnd(32);DK=await aesKey(RAW);const salt=rnd(16);const pk=await pinKey(pin,salt,ITER);
 E={v:2,salt:b64(salt),iter:ITER,wp:await aesEnc(pk,RAW),bio:null,d:null};M.pinLen=len;M.bio=false;saveM();delete S.set.pin;await flush(true);st(K1,null)}
async function changePin(pin,len){const salt=rnd(16);const pk=await pinKey(pin,salt,ITER);E.salt=b64(salt);E.iter=ITER;E.wp=await aesEnc(pk,RAW);M.pinLen=len;saveM();await flush(true)}
async function removeEnc(){E=null;DK=null;RAW=null;M.bio=false;saveM();await flush(true);st(K2,null)}
let saving=Promise.resolve(),saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>flush(),250)}
function flush(force){clearTimeout(saveT);saving=saving.then(async()=>{if(locked&&!force)return;const json=JSON.stringify(S);
 if(E&&DK){E.d=await aesEnc(DK,te.encode(json));if(!st(K2,E))toast('Kaydedilemedi: cihaz hafızası dolu')}else if(!E){if(!st(K1,json))toast('Kaydedilemedi: cihaz hafızası dolu')}}).catch(()=>{});return saving}

/* Face ID: WebAuthn PRF ile anahtar sarma */
const bioOk=()=>!!(window.PublicKeyCredential&&navigator.credentials);
async function prfGet(id,ps){const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:ps}}}}});
 const r=a.getClientExtensionResults();return r&&r.prf&&r.prf.results&&r.prf.results.first}
let pendingCred=null;
async function bioEnable(){if(!bioOk())throw new Error('unsupported');const ps=rnd(32);let out;
 if(pendingCred){out=await prfGet(pendingCred.id,pendingCred.ps);if(!out)throw new Error('noprf');return bioFinish(pendingCred.id,pendingCred.ps,out)}
 const cred=await navigator.credentials.create({publicKey:{rp:{name:'Portföy',id:location.hostname},user:{id:rnd(16),name:'Portföy',displayName:'Portföy'},challenge:rnd(32),
  pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,extensions:{prf:{eval:{first:ps}}}}});
 const ext=cred.getClientExtensionResults()||{};if(!ext.prf||ext.prf.enabled===false)throw new Error('noprf');
 out=ext.prf.results&&ext.prf.results.first;const id=new Uint8Array(cred.rawId);
 if(!out){pendingCred={id,ps};return 'again'}
 return bioFinish(id,ps,out)}
async function bioFinish(id,ps,out){const bk=await aesKey(out);E.bio={id:b64(id),ps:b64(ps),...await aesEnc(bk,RAW)};pendingCred=null;M.bio=true;saveM();await flush(true);return 'ok'}

/* ================= hesap ================= */
const PRESET={'S&P':0,'Nasdaq':1,'Altın':2,'Emtia':3,'Tahvil':4,'Momentum':5,'Teknoloji':6,'Özel':7,'Türkiye':8};
function colorOf(t){const c=S.set.colors;if(c[t]==null){const used=new Set(Object.values(c));let k=PRESET[t];if(k==null||used.has(k)){k=0;while(used.has(k)&&k<10)k++;if(used.has(k))k=Object.keys(c).length%11}c[t]=k;save()}return 'var(--c'+c[t]+')'}
const types=()=>[...new Set([...S.pos.map(p=>p.t),...Object.keys(S.set.targets)])];
function market(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const o=Object.fromEntries(p.map(x=>[x.type,x.value]));const m=+o.hour*60+ +o.minute;return !['Sat','Sun'].includes(o.weekday)&&m>=570&&m<960}
function calc(){
 const mk=market();
 const rows=S.pos.map(p=>{const q=S.prices[p.s];const px=q&&q.c>0?q.c:null;const price=px??p.a;const live=px!=null&&q.pc>0&&q.src!=='manual';
  const value=p.q*price,cost=p.q*p.a;
  return {...p,px,price,value,cost,day:live?p.q*(px-q.pc):0,dayP:live?px/q.pc-1:NaN,pl:value-cost,plP:cost?value/cost-1:0,est:px==null,src:q&&q.src,qt:q&&q.t,stale:mk&&q&&q.src==='api'&&Date.now()-q.t>15*60e3}});
 const total=rows.reduce((a,r)=>a+r.value,0),cost=rows.reduce((a,r)=>a+r.cost,0),day=rows.reduce((a,r)=>a+r.day,0);
 rows.forEach(r=>r.w=total?r.value/total:0);
 const g={};rows.forEach(r=>{(g[r.t]??={t:r.t,value:0,cost:0,day:0,rows:[]});g[r.t].value+=r.value;g[r.t].cost+=r.cost;g[r.t].day+=r.day;g[r.t].rows.push(r)});
 Object.keys(S.set.targets).forEach(t=>{if(!g[t]&&S.set.targets[t]>0)g[t]={t,value:0,cost:0,day:0,rows:[]}});
 const groups=Object.values(g).map(x=>({...x,w:total?x.value/total:0,tw:(S.set.targets[x.t]||0)/100})).sort((a,b)=>b.value-a.value||b.tw-a.tw);
 groups.forEach(x=>x.rows.sort((a,b)=>b.value-a.value));
 return {rows,total,cost,day,dayP:total-day?day/(total-day):0,pl:total-cost,plP:cost?total/cost-1:0,groups,est:rows.some(r=>r.est)}}

/* ================= fiyat ================= */
let busy=false,lastOk=0,lastErr='';

/* ---- ısı haritası ---- */
function squarify(items,x,y,w,h){const out=[];let rest=items.slice();
 while(rest.length&&w>0.5&&h>0.5){const sh=Math.min(w,h);let row=[],best=Infinity;
  for(const it of rest){const t=[...row,it];const s=t.reduce((a,b)=>a+b.a,0),mx=Math.max(...t.map(b=>b.a)),mn=Math.min(...t.map(b=>b.a));const wr=Math.max(sh*sh*mx/(s*s),(s*s)/(sh*sh*mn));if(wr<=best){best=wr;row=t}else break}
  const s=row.reduce((a,b)=>a+b.a,0);
  if(w>=h){const cw=s/h;let cy=y;row.forEach(b=>{const bh=b.a/cw;out.push({...b,x,y:cy,w:cw,h:bh});cy+=bh});x+=cw;w-=cw}
  else{const ch=s/w;let cx=x;row.forEach(b=>{const bw=b.a/ch;out.push({...b,x:cx,y,w:bw,h:ch});cx+=bw});y+=ch;h-=ch}
  rest=rest.slice(row.length)}return out}
function heatCol(d){if(!isFinite(d))return 'var(--sf2)';const p=Math.round(Math.min(1,Math.abs(d)/0.03)*75+(Math.abs(d)>0.0005?10:0));return p<5?'var(--sf2)':`color-mix(in srgb,var(${d>0?'--up':'--dn'}) ${p}%,var(--sf2))`}
function drawHeat(c){const el=$('#heat');const draw=()=>{const W=el.clientWidth,H=el.clientHeight;if(!W)return;
 const rows=[...c.rows].filter(r=>r.value>0).sort((a,b)=>b.value-a.value);const tot=rows.reduce((a,r)=>a+r.value,0);
 const t=squarify(rows.map(r=>({r,a:r.value/tot*W*H})),0,0,W,H);
 el.innerHTML=t.map(b=>{const d=b.r.dayP,strong=isFinite(d)&&Math.abs(d)>0.018;const fg=strong?'#fff':'var(--ink)';const sz=b.w<46||b.h<34?'sm xs':b.w<72||b.h<50?'sm':'';
  return `<div class="tile ${sz}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"><div data-s="${esc(b.r.s)}" style="background:${heatCol(d)};color:${fg}"><b>${esc(b.r.s)}</b><span>${isFinite(d)?arw(d):'—'}</span></div></div>`}).join('')};
 draw();if(window.hro1)hro1.disconnect();window.hro1=new ResizeObserver(draw);hro1.observe(el);
 el.onclick=e=>{const s=e.target.closest('[data-s]')?.dataset.s;if(s)detail(s)}}

function plan(cash,whole){const c=calc();const tg=c.groups.filter(g=>g.tw>0&&g.rows.length);if(!tg.length)return null;
 const st0=tg.reduce((a,g)=>a+g.tw,0),base=tg.reduce((a,g)=>a+g.value,0)+cash;
 const L=tg.map(g=>{const r=g.rows.find(x=>x.s===S.set.pref[g.t])||g.rows[0];return {g,r,goal:g.tw/st0*base,amt:0,q:0}});
 const def=L.map(x=>Math.max(0,x.goal-x.g.value)),sd=def.reduce((a,b)=>a+b,0);
 L.forEach((x,i)=>x.amt=sd>0?def[i]*Math.min(1,cash/sd):0);
 const rem=cash-L.reduce((a,x)=>a+x.amt,0);if(rem>0.01)L.forEach(x=>x.amt+=rem*x.g.tw/st0);
 if(whole){L.forEach(x=>{x.q=Math.floor(x.amt/x.r.price+1e-9);x.amt=x.q*x.r.price});let left=cash-L.reduce((a,x)=>a+x.amt,0);
  for(let k=0;k<2000;k++){const cand=L.filter(x=>x.r.price<=left+1e-9).map(x=>({x,gap:x.goal-(x.g.value+x.amt)})).sort((a,b)=>b.gap-a.gap)[0];
   if(!cand||cand.gap<cand.x.r.price*0.5)break;cand.x.q++;cand.x.amt+=cand.x.r.price;left-=cand.x.r.price}}
 else L.forEach(x=>x.q=x.amt/x.r.price);
 const spent=L.reduce((a,x)=>a+x.amt,0),nt=c.total+spent;
 L.forEach(x=>x.nw=nt?(x.g.value+x.amt)/nt:0);
 return {L:L.filter(x=>x.q>0),all:L,left:cash-spent,spent}}

function perfPts(){return Object.entries(S.hist).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,o])=>({d,v:o.v,n:o.n??o.c,b:o.b}))}
function xirr(cf){const f=r=>cf.reduce((a,c)=>a+c.a/Math.pow(1+r,c.t/365),0);let lo=-0.95,hi=20,flo=f(lo),fhi=f(hi);if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0)return NaN;
 for(let i=0;i<120;i++){const m=(lo+hi)/2,fm=f(m);if(flo*fm<=0)hi=m;else{lo=m;flo=fm}}return (lo+hi)/2}
function perf(all,p){if(all.length<2)return null;const end=new Date(all.at(-1).d);let sd=null;
 if(p==='1h')sd=new Date(end-7*DAY);else if(p==='1a')sd=new Date(end-30*DAY);else if(p==='3a')sd=new Date(end-91*DAY);else if(p==='yb')sd=new Date(end.getFullYear(),0,1);
 let i0=0;if(sd){const s=sd.toISOString().slice(0,10);all.forEach((x,i)=>{if(x.d<=s)i0=i})}
 const pts=all.slice(i0);if(pts.length<2)return null;const idx=[1];
 for(let i=1;i<pts.length;i++){const fl=pts[i].n-pts[i-1].n,r=pts[i-1].v>0?(pts[i].v-fl)/pts[i-1].v:1;idx.push(idx[i-1]*r)}
 const bi0=pts.findIndex(x=>x.b>0);const bi=pts.map((x,i)=>bi0>=0&&i>=bi0&&x.b>0?x.b/pts[bi0].b:null);
 const days=d=>(new Date(d)-new Date(pts[0].d))/DAY,span=days(pts.at(-1).d);
 const cf=[{t:0,a:-pts[0].v}];for(let i=1;i<pts.length;i++){const fl=pts[i].n-pts[i-1].n;if(Math.abs(fl)>0.005)cf.push({t:days(pts[i].d),a:-fl})}cf.push({t:span,a:pts.at(-1).v});
 let mw=NaN;if(span>=30){const x=xirr(cf);mw=span>=365?x:Math.pow(1+x,span/365)-1}
 const spy=bi.at(-1)!=null?bi.at(-1)-1:NaN;
 return {pts,idx,bi,twr:idx.at(-1)-1,spy,ex:idx.at(-1)-1-spy,mw,span,added:pts.at(-1).n-pts[0].n,gain:pts.at(-1).v-pts[0].v-(pts.at(-1).n-pts[0].n)}}

function drawPerf(P){const s=$('#psv'),tip=$('#ptip');const pts=P.pts;const ret=perfMode==='ret';
 const A=ret?P.idx.map(v=>(v-1)):pts.map(p=>p.v),B=ret?P.bi.map(v=>v==null?null:v-1):pts.map(p=>p.n);
 const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;const pl=ret?54:8,pr=8,pt=12,pb=22;
  const vs=[...A,...B.filter(v=>v!=null)];let lo=Math.min(...vs),hi=Math.max(...vs);const pad=(hi-lo)*.12||Math.abs(hi)*.02||.01;lo-=pad;hi+=pad;
  const X=i=>pl+(W-pl-pr)*(i/(pts.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ln=a=>{let d='',m=true;a.forEach((v,i)=>{if(v==null){m=true;return}d+=(m?'M':'L')+X(i).toFixed(1)+' '+Y(v).toFixed(1);m=false});return d};
  let g='';if(ret){const tk=[0];[lo+(hi-lo)*.12,hi-(hi-lo)*.12].forEach(v=>{if(Math.abs(Y(v)-Y(0))>18||!(0>=lo&&0<=hi))tk.push(v)});tk.forEach(v=>{if(v<lo||v>hi)return;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?'':'stroke-dasharray="3 4"'}/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" fill="var(--ink2)" text-anchor="end">${v===0?'%0':(v>0?'+':MI)+'%'+N1.format(Math.abs(v*100))}</text>`})}
  s.innerHTML=g+`<path d="${ln(B)}" fill="none" stroke="var(--mut)" stroke-width="1.5" ${ret?'':'stroke-dasharray="4 4"'}/><path d="${ln(A)}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>
  <text x="${pl}" y="${H-6}" font-size="11" fill="var(--ink2)">${fmtD(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" font-size="11" fill="var(--ink2)" text-anchor="end">${fmtD(pts.at(-1).d)}</text>
  <line id="px" y1="${pt}" y2="${H-pb}" stroke="var(--ink2)" opacity="0"/><circle id="pc" r="4.5" fill="var(--ac)" stroke="var(--sf)" stroke-width="2" opacity="0"/>`;
  const mv=e=>{const r=s.getBoundingClientRect();const i=Math.max(0,Math.min(pts.length-1,Math.round((e.clientX-r.left-pl)/(W-pl-pr)*(pts.length-1))));
   s.querySelector('#px').setAttribute('x1',X(i));s.querySelector('#px').setAttribute('x2',X(i));s.querySelector('#px').setAttribute('opacity',1);
   const cc=s.querySelector('#pc');cc.setAttribute('cx',X(i));cc.setAttribute('cy',Y(A[i]));cc.setAttribute('opacity',1);
   tip.style.display='block';tip.style.left=Math.max(80,Math.min(W-80,X(i)))+'px';tip.style.top=Y(A[i])+'px';
   tip.textContent=fmtD(pts[i].d)+' · '+(ret?'Portföy '+arw(A[i])+(B[i]!=null?' · SPY '+arw(B[i]):''):(S.set.hide?'•••':usd(A[i])))};
  s.onpointermove=mv;s.onpointerdown=mv;s.onpointerleave=()=>{tip.style.display='none';s.querySelector('#px')?.setAttribute('opacity',0);s.querySelector('#pc')?.setAttribute('opacity',0)}};
 draw();if(window.hro2)hro2.disconnect();window.hro2=new ResizeObserver(draw);hro2.observe(s)}

function drawOverlap(c){const el=$('#ovl');const ex={},src={};
 c.rows.forEach(r=>{const h=HOLD[r.s];if(!h)return;Object.entries(h).forEach(([k,w])=>{ex[k]=(ex[k]||0)+r.w*w/100;(src[k]??=[]).push(r.s)})});
 const top=Object.entries(ex).sort((a,b)=>b[1]-a[1]).slice(0,8);const mx=top.length?top[0][1]:1;const m7=MAG7.reduce((a,k)=>a+(ex[k]||0),0);
 const byIdx={};c.rows.forEach(r=>{const i=IDX[r.s];if(i)(byIdx[i]??=[]).push(r)});const dups=Object.entries(byIdx).filter(([i,a])=>a.length>1);

function arc(cx,cy,r0,r1,a0,a1){const p=(r,a)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];const L=a1-a0>Math.PI?1:0;const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
 return `M${x0} ${y0}A${r1} ${r1} 0 ${L} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${L} 0 ${x3} ${y3}Z`}

function drawDonut(c){const el=$('#dn');const ss=segs(c);let a=0,h='';const one=ss.length===1;
 ss.forEach(s=>{const da=s.w*2*Math.PI;const p=one?'M100 8A92 92 0 1 1 99.99 8L99.99 50A50 50 0 1 0 100 50Z':arc(100,100,60,96,a,a+da);h+=`<path d="${p}" fill="${s.col}" stroke="var(--sf)" stroke-width="2" data-id="${esc(s.id)}" class="${selT===s.id?'on':''}"/>`;a+=da});

const RDEF=()=>[{id:'etf',k:'maxEtf',on:true,v:20},{id:'typ',k:'maxType',on:false,v:45,t:'S&P'},{id:'m7',k:'mag7',on:true,v:25},{id:'co',k:'maxCo',on:false,v:8},{id:'bnd',k:'band',on:true,v:0},{id:'rb',k:'rebal',on:true,v:3},{id:'dd',k:'ddEtf',on:true,v:15},{id:'pdd',k:'ddPort',on:false,v:10}];
const RLAB={maxEtf:['Tek bir ETF portföyün en fazla','%'],maxType:['Bir tür portföyün en fazla','%'],mag7:['Yedi büyük teknoloji şirketine fonlar üzerinden maruziyet en fazla','%'],maxCo:['Tek bir şirkete fonlar üzerinden maruziyet en fazla','%'],
 band:['Hedef bandı dışına çıkan tür olursa uyar',''],rebal:['Dengeleme kontrolü sıklığı','ayda bir'],ddEtf:['Bir ETF zirvesinden bu kadar düşerse uyar','%'],ddPort:['Portföy (zaman ağırlıklı) zirvesinden bu kadar düşerse uyar','%']};
function rules(){if(!Array.isArray(S.rules)){S.rules=RDEF();save()}const ids=new Set(S.rules.map(r=>r.id));RDEF().forEach(r=>{if(!ids.has(r.id))S.rules.push({...r,on:false})});return S.rules}
function lookThrough(c){const ex={};c.rows.forEach(r=>{const h=HOLD[r.s];if(h)Object.entries(h).forEach(([k,w])=>ex[k]=(ex[k]||0)+r.w*w/100)});return ex}
function portIdx(){const pts=perfPts();if(pts.length<2)return null;const idx=[1];for(let i=1;i<pts.length;i++){const fl=pts[i].n-pts[i-1].n,r=pts[i-1].v>0?(pts[i].v-fl)/pts[i-1].v:1;idx.push(idx[i-1]*r)}return idx}

  else if(r.k==='maxCo'){const ex=lookThrough(c);const top=Object.entries(ex).sort((a,b)=>b[1]-a[1]);const bad=top.filter(x=>x[1]>v),near=top.filter(x=>x[1]<=v&&x[1]>=v*0.9);
   if(bad.length)L('bad','Tek şirket sınırı ('+P0(r.v)+') aşıldı',bad.map(x=>(CN[x[0]]||x[0])+' '+pct(x[1])).join(' · '));else if(near.length)L('near','Tek şirket sınırına ('+P0(r.v)+') yaklaşıldı',near.map(x=>(CN[x[0]]||x[0])+' '+pct(x[1])).join(' · '));else L('ok','Tek şirket sınırı')}

   if(o.length)L('bad','Hedef bandı dışında '+o.length+' tür var',o.map(g=>g.t+' '+pp(g.w-g.tw)).join(' · '));else L('ok','Hedef bantları')}
  else if(r.k==='rebal'){const last=S.lastRebal||Date.now(),due=last+(+r.v||3)*30.44*DAY,left=Math.ceil((due-Date.now())/DAY);

  else if(r.k==='ddEtf'){const bad=[],near=[];c.rows.forEach(x=>{const pk=S.peaks&&S.peaks[x.s];if(!pk||x.px==null||x.src!=='api')return;const dd=x.px/pk.p-1;const s=x.s+' '+arw(dd)+' (zirve '+usd(pk.p)+', '+fmtD(pk.d)+')';if(dd<=-v)bad.push(s);else if(dd<=-v*0.8)near.push(s)});

  else if(r.k==='ddPort'){const idx=portIdx();if(!idx){L('ok','Portföy düşüş uyarısı');continue}const pk=Math.max(...idx),dd=idx.at(-1)/pk-1;
   if(dd<=-v)L('bad','Portföy zirvesinden '+arw(dd)+' aşağıda','Sınır '+P0(r.v));else if(dd<=-v*0.8)L('near','Portföy düşüşü sınıra yaklaştı',arw(dd)+' · sınır '+P0(r.v));else L('ok','Portföy düşüş uyarısı')}}

 const days=p==='h'?7:30,lim=daysAgo(days),all=Object.entries(S.hist).sort((a,b)=>a[0]<b[0]?-1:1);let base=null;

$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
$('#rf').onclick=()=>refresh(true);
$('#eye').onclick=()=>{S.set.hide=!S.set.hide;save();render()};
/* çekip yenile */
{let py=null;const ptr=$('#ptr');
 addEventListener('touchstart',e=>{py=scrollY<=0&&!locked&&!$('#sheet').classList.contains('on')&&!e.target.closest('.row,.heat,.fig')?e.touches[0].clientY:null},{passive:true});
 addEventListener('touchmove',e=>{if(py==null)return;const d=e.touches[0].clientY-py;if(d>0){ptr.style.height=Math.min(56,d*.45)+'px';ptr.classList.toggle('go',d>120)}},{passive:true});
 addEventListener('touchend',()=>{if(py==null)return;if(ptr.classList.contains('go'))refresh(true);ptr.style.height='0';ptr.classList.remove('go');py=null})}

/* ================= kilit ================= */
let pinBuf='',hidAt=0;
function drawPin(){const n=legacyPin?4:(M.pinLen||4);$('#pd').innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<pinBuf.length?'f':''}"></i>`).join('')}
function showLock(msg){locked=true;pinBuf='';drawPin();$('#lockMsg').textContent=msg||'PIN kodunu gir';$('#fid').style.display=E&&E.bio&&M.bio?'':'none';$('#lock').classList.add('on');document.body.classList.add('locked');lockTick()}
async function lockNow(){if(!E&&!legacyPin)return;if(locked)return;await flush();if(E){S=DEF();DK=null;RAW=null}closeSheet();showLock()}
function lockTick(){if(M.until>Date.now()){$('#lockMsg').textContent='Çok fazla hatalı deneme. '+Math.ceil((M.until-Date.now())/1000)+' sn bekle.';setTimeout(lockTick,1000)}}
async function openWith(raw){RAW=raw;DK=await aesKey(raw);S=merge(E.d?JSON.parse(td.decode(await aesDec(DK,E.d))):{})}
async function unlocked(){M.fails=0;M.until=0;saveM();locked=false;$('#lock').classList.remove('on');document.body.classList.remove('locked');pinBuf='';
 if(!started)start();else{go(S.set.tab||cur);refresh()}}
function failed(){M.fails=(M.fails||0)+1;if(M.fails>=5)M.until=Date.now()+Math.min(900,30*2**(M.fails-5))*1000;saveM();const p=$('#pd');p.classList.add('bad');
 setTimeout(()=>{p.classList.remove('bad');pinBuf='';drawPin();$('#lockMsg').textContent=M.until>Date.now()?'':'PIN yanlış, tekrar dene';lockTick()},400)}
async function tryPin(pin){
 if(legacyPin){if(await legacyHash(pin)===legacyPin){legacyPin=null;$('#lockMsg').textContent='Veriler şifreleniyor…';await setupEnc(pin,4);await unlocked()}else failed();return}
 $('#lockMsg').textContent='Açılıyor…';try{const pk=await pinKey(pin,ub64(E.salt),E.iter);const raw=await aesDec(pk,E.wp);await openWith(raw)}catch(e){failed();return}await unlocked()}
$('#pad').onclick=async e=>{const b=e.target.closest('button');if(!b||M.until>Date.now())return;if(b.dataset.x){pinBuf=pinBuf.slice(0,-1);drawPin();return}
 const n=legacyPin?4:(M.pinLen||4);if(pinBuf.length>=n)return;pinBuf+=b.textContent;drawPin();if(pinBuf.length===n)tryPin(pinBuf)};
$('#fid').onclick=async()=>{if(M.until>Date.now())return;try{const out=await prfGet(ub64(E.bio.id),ub64(E.bio.ps));if(!out)throw 0;const raw=await aesDec(await aesKey(out),E.bio);await openWith(raw);await unlocked()}
 catch(e){$('#lockMsg').textContent='Face ID ile açılamadı, PIN’i kullan'}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hidAt=Date.now();flush()}else{if(!locked&&hidAt&&Date.now()-hidAt>120000&&(E||legacyPin))lockNow();else if(!locked&&Date.now()-lastOk>60000)refresh();if(!locked)setTop()}});
addEventListener('pagehide',()=>flush());

/* ================= başlat ================= */
function start(){started=true;if(!S.lastRebal){S.lastRebal=Date.now();save()}if(S.netIn==null&&S.pos.length)S.netIn=+S.pos.reduce((a,p)=>a+p.q*p.a,0).toFixed(2);
 document.body.classList.remove('locked');cur=TT[S.set.tab]?S.set.tab:'ozet';go(cur);schedule();refresh()}
applyTheme();
if(E&&E.wp)showLock();
else{E=null;S=merge(ld(K1));if(S.set.pin){legacyPin=S.set.pin;showLock()}else start()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
